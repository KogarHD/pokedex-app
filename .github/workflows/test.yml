name: Basic Workflow Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  verify-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if important files exist
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          test -f pokedex.csv


